<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Konverter{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bs-font-monospace: "SF Mono", "Fira Code", "Fira Mono", Menlo, Consolas, monospace;
        }
        body { font-size: 0.9rem; }
        .level-error { color: #dc3545; font-weight: 600; }
        .level-warning { color: #ffc107; font-weight: 600; }
        .level-info { color: #0d6efd; }
        .level-debug { color: #6c757d; }
        .text-muted { color: #6c757d !important; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
        .card { border-radius: 0.5rem; }
        .table th { font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="{{ url_for('main.index') }}">
                <i class="bi bi-file-earmark-arrow-down"></i> Konverter
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('logs.index') }}"><i class="bi bi-journal-text"></i> Log Viewer</a>
            </div>
        </nav>
        <div class="container-fluid px-4">
            {% block content %}{% endblock %}
        </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
