name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Cek kode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall app wsgi.py run.py

      - name: Import check
        run: python -c "from app import create_app; create_app()"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Secret RENDER_DEPLOY_HOOK belum diset." >&2
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
