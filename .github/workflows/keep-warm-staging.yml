name: Keep Streamlit Staging Awake

on:
  schedule:
    - cron: "23 */3 * * *"
  push:
    branches: [staging]
    paths:
      - ".github/workflows/keep-warm-staging.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-streamlit-staging-awake
  cancel-in-progress: true

jobs:
  keep-warm-staging:
    name: Buka app staging & bangunkan bila tidur
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .github/scripts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: .github/scripts/package-lock.json

      - name: Cache browser Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('.github/scripts/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Kunjungi aplikasi staging
        env:
          APP_URL: ${{ vars.STREAMLIT_STAGING_APP_URL || 'https://stagging-konverter.streamlit.app' }}
          HOLD_SECONDS: "60"
        run: node keep-warm.mjs

      - name: Upload screenshot kegagalan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-warm-staging-failure
          path: .github/scripts/keep-warm-failure.png
          if-no-files-found: ignore
          retention-days: 7
