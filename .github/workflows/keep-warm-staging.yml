name: Keep Streamlit Staging Awake

# Menjaga app Streamlit staging (deploy dari branch `staging`) tetap bangun.
# Streamlit memakai "kunjungan browser sungguhan" (JavaScript + WebSocket) sebagai
# aktivitas, bukan HTTP GET biasa. Karena itu workflow ini membuka app di Chromium
# headless lewat Playwright, mengklik tombol "Yes, get this app back up!" bila app
# sedang tidur, lalu menahan sesi sebentar agar aktivitas tercatat.
#
# Pasang URL app staging di: Settings > Secrets and variables > Actions > Variables
#   name : STREAMLIT_STAGING_APP_URL
#   value: https://<subdomain>-staging.streamlit.app
# Kalau variabel belum diisi, dipakai nilai default di bawah.
#
# Catatan: jadwal (cron) hanya aktif bila file workflow ini ada di branch default
# (`main`). Dari branch `staging`, gunakan tombol "Run workflow" di tab Actions.

on:
  schedule:
    # Tiap 3 jam, menit ke-23 (beri jarak dari workflow app utama).
    - cron: "23 */3 * * *"
  push:
    branches: [staging]
    paths:
      - ".github/workflows/keep-warm-staging.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-streamlit-staging-awake
  cancel-in-progress: true

jobs:
  keep-warm-staging:
    name: Buka app staging & bangunkan bila tidur
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .github/scripts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: .github/scripts/package-lock.json

      - name: Cache browser Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('.github/scripts/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Kunjungi aplikasi staging
        env:
          APP_URL: ${{ vars.STREAMLIT_STAGING_APP_URL || 'https://all-convert-staging.streamlit.app' }}
          HOLD_SECONDS: "60"
        run: node keep-warm.mjs

      - name: Upload screenshot kegagalan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-warm-staging-failure
          path: .github/scripts/keep-warm-failure.png
          if-no-files-found: ignore
          retention-days: 7
